name: Build and Test

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Setup .NET 9 SDK
    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # 2. Restore NuGet dependency
    - name: Restore dependencies
      run: dotnet restore TrafficStatistics.sln

    # 3. Build solution
    - name: Build solution
      run: dotnet build TrafficStatistics.sln -c Release --no-restore

    # 4. Run unit tests
    - name: Run unit tests
      run: dotnet test TrafficStatistics.sln -c Release --no-build --verbosity normal

    # 5. Publish Standalone Executable (Self-Contained Single File, x64)
    - name: Publish Standalone Executable (win-x64)
      run: |
        dotnet publish src/TrafficStatistics.App/TrafficStatistics.App.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -o ./publish/TrafficStatistics_Standalone

    # 6. Publish Portable Executable (Framework-Dependent Portable, x64)
    - name: Publish Portable Executable (win-x64)
      run: |
        dotnet publish src/TrafficStatistics.App/TrafficStatistics.App.csproj `
          -c Release `
          -r win-x64 `
          --self-contained false `
          -o ./publish/TrafficStatistics_Portable

    # 7. Compress artifacts
    - name: Compress artifacts
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/TrafficStatistics_Standalone/* -DestinationPath ./publish/TrafficStatistics-Standalone-win-x64.zip
        Compress-Archive -Path ./publish/TrafficStatistics_Portable/* -DestinationPath ./publish/TrafficStatistics-Portable-win-x64.zip

    # 8. Upload Standalone Artifact
    - name: Upload Standalone Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrafficStatistics-Standalone-win-x64
        path: ./publish/TrafficStatistics-Standalone-win-x64.zip
        retention-days: 14

    - name: Upload Portable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrafficStatistics-Portable-win-x64
        path: ./publish/TrafficStatistics-Portable-win-x64.zip
        retention-days: 14

    # 9.  Create GitHub Release
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./publish/TrafficStatistics-Standalone-win-x64.zip
          ./publish/TrafficStatistics-Portable-win-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
